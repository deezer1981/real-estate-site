# Deploy frontend to GitHub Pages
# - بعد از push معمولی روی main
# - دستی از Actions
# - بعد از اتمام موفق Update Snapshot (چون commit با GITHUB_TOKEN
#   رویداد push را برای ورکفلوهای دیگر تریگر نمی‌کند)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  # بعد از اسنپ‌شات موفق، Pages را هم به‌روز کن
  workflow_run:
    workflows: ["Update Snapshot (آگهی‌ها)"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # اگر از اسنپ‌شات آمده، فقط وقتی آن Run موفق بوده دیپلوی کن
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # وقتی از workflow_run می‌آییم، همان commit اسنپ‌شات را بگیر
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './realestate-site/frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
