name: Update Property Snapshot

on:
  schedule:
    - cron: '0 * * * *'   # هر ساعت
  workflow_dispatch: {}    # امکان اجرای دستی

permissions:
  contents: write
  pages: write
  id-token: write

# جلوگیری از تداخل دیپلوی‌های همزمان
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build snapshot
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          MENU_SHEET_GID: ${{ secrets.MENU_SHEET_GID }}
        run: python realestate-site/scripts/build_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add realestate-site/frontend/index.html
          git diff --cached --quiet || git commit -m "Auto-update property snapshot"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './realestate-site/frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
