<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="grad_apartment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4A63"/>
      <stop offset="100%" stop-color="#1E2A3D"/>
    </linearGradient>
    <linearGradient id="overlay_apartment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#grad_apartment)"/>

  <g transform="translate(500.0, 230.0)">
    
      <g stroke="#F5EFE6" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <rect x="40" y="30" width="120" height="150" rx="4"/>
        <line x1="40" y1="70" x2="160" y2="70"/>
        <line x1="40" y1="110" x2="160" y2="110"/>
        <line x1="40" y1="150" x2="160" y2="150"/>
        <line x1="80" y1="30" x2="80" y2="180"/>
        <line x1="120" y1="30" x2="120" y2="180"/>
      </g>
    
  </g>

  <rect x="0" y="0" width="1200" height="800" fill="url(#overlay_apartment)"/>

  <text x="60" y="745" font-family="'Vazirmatn','Noto Sans Arabic','Tahoma','Arial',sans-serif"
        font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" direction="rtl">آپارتمان</text>
</svg>
