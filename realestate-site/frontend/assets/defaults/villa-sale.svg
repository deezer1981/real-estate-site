<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#FBF6EE"/>
  <g fill="#2C5F6E" transform="translate(100,70)">
    <!-- roof -->
    <polygon points="100,10 20,70 180,70" fill="#1E4550"/>
    <!-- body -->
    <rect x="35" y="70" width="130" height="90" rx="2"/>
    <!-- door -->
    <rect x="85" y="110" width="30" height="50" rx="2" fill="#FBF6EE"/>
    <!-- windows -->
    <rect x="50" y="90" width="28" height="24" rx="1" fill="#FBF6EE"/>
    <rect x="122" y="90" width="28" height="24" rx="1" fill="#FBF6EE"/>
    <!-- chimney -->
    <rect x="140" y="30" width="16" height="30" fill="#1E4550"/>
    <!-- base -->
    <ellipse cx="100" cy="165" rx="90" ry="10" fill="#2C5F6E" opacity="0.2"/>
  </g>
  <ellipse cx="80" cy="210" rx="25" ry="18" fill="#2C5F6E" opacity="0.3"/>
  <ellipse cx="320" cy="210" rx="25" ry="18" fill="#2C5F6E" opacity="0.3"/>
  <text x="200" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1E4550">Villa for Sale</text>
</svg>
